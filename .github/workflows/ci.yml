name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    # Homebrew provides ffmpeg (x264, x265, SVT-AV1) and libvmaf ≥ 3.2.1 with
    # the v1 models, which the tests and the cgo binding need.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install ffmpeg, libvmaf and golangci-lint
        # The runner images turn Homebrew's auto-update off: without an
        # update, brew installs the formulae of the image, such as libvmaf
        # 3.2.0 whose bottle lacks the speed_chroma extractor VMAF v1 needs.
        run: |
          brew update
          brew install ffmpeg libvmaf pkg-config golangci-lint
          brew list --versions ffmpeg libvmaf golangci-lint

      - name: Vet
        run: go vet ./...

      - name: Build without cgo
        # Only vmaf/libvmaf binds libvmaf: the service packages stay pure Go.
        run: CGO_ENABLED=0 go build ./analysis ./ladder ./pipeline ./quality

      - name: Lint
        run: golangci-lint run ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out | tail -n 1
          echo "### Coverage: $(go tool cover -func=coverage.out | tail -n 1 | awk '{print $3}')" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  docker:
    name: Docker image
    # Builds the CPU image (linux/amd64) and smoke-tests it; the cache scope
    # is the one of the release workflow, which main keeps warm.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: qc:ci
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,scope=linux-amd64,mode=max

      - name: Smoke test
        run: packaging/docker/smoke-test.sh qc:ci
