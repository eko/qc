<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img">
<title>What more titles change</title>
<desc>Three line charts against the number of titles in the corpus, for instant and for four anchors. The bitrate error falls from 9.0 to 6.8 percent for instant and stays near 2.3 percent for four anchors. The mean change of a predicted bitrate when a title is added falls from 3.3 to 0.3 percent for instant, and that of the top rung from 8.5 to 0.9 percent.</desc>
