<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img">
<title>An instant prediction against the truth</title>
<desc>Five small charts, one per resolution, of VMAF against bitrate. The line is the curve predicted without any encode, the dots the measured encodes. They agree within about one VMAF point; the predicted bitrates are 10 to 20 percent low.</desc>
<style>
