<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img">
<title>The time of a ladder</title>
<desc>Horizontal bars of the time of a ladder: 7 minutes 16 seconds with fixed probing, 2 minutes 47 with a model of 4 anchors, 2 minutes 9 predicted and verified, 12 seconds instant.</desc>
<style>
:root{--surface:#fcfcfb;--border:#e1e0d9;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--quiet:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--q1:#cde2fb;--q2:#9ec5f4;--q3:#6da7ec;--q4:#3987e5;--q5:#1c5cab;--q6:#0d366b;}
@media (prefers-color-scheme: dark){:root{--surface:#1a1a19;--border:#2c2c2a;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--quiet:#52514e;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--q1:#0d366b;--q2:#184f95;--q3:#256abf;--q4:#3987e5;--q5:#6da7ec;--q6:#b7d3f6;}}
text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:12px;fill:var(--ink2)}
.title{font-size:15px;font-weight:600;fill:var(--ink)}
.sub{font-size:12.5px;fill:var(--ink2)}
.head{font-size:13px;font-weight:600;fill:var(--ink)}
.val{fill:var(--ink);font-variant-numeric:tabular-nums}
.tick{fill:var(--muted);font-variant-numeric:tabular-nums}
.note{fill:var(--muted)}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
</style>
<rect x="0.5" y="0.5" width="899" height="249" rx="8" fill="var(--surface)" stroke="var(--border)"/>
<text class="title" x="24" y="32">The time of a ladder</text>
<text class="sub" x="24" y="52">An hour-long 1080p title, x264 fast, Apple M2 Max; the model had never seen the title.</text>
<line x1="330.0" y1="80.0" x2="330.0" y2="224.0" class="axis"/>
<text x="330.0" y="242.0" text-anchor="middle" class="tick">0</text>
<line x1="433.2" y1="80.0" x2="433.2" y2="224.0" class="grid"/>
<text x="433.2" y="242.0" text-anchor="middle" class="tick">2 min</text>
<line x1="536.4" y1="80.0" x2="536.4" y2="224.0" class="grid"/>
<text x="536.4" y="242.0" text-anchor="middle" class="tick">4 min</text>
<line x1="639.6" y1="80.0" x2="639.6" y2="224.0" class="grid"/>
<text x="639.6" y="242.0" text-anchor="middle" class="tick">6 min</text>
<line x1="742.8" y1="80.0" x2="742.8" y2="224.0" class="grid"/>
<text x="742.8" y="242.0" text-anchor="middle" class="tick">8 min</text>
<text x="318.0" y="104.0" text-anchor="end">Fixed probing, every rung verified</text>
<path d="M330.0,92.0 h371.0 a4,4 0 0 1 4,4 v8.0 a4,4 0 0 1 -4,4 h-371.0 z" fill="var(--quiet)"/>
<text x="713.0" y="104.0" text-anchor="start" class="val">7 min 16 s</text>
<text x="789.0" y="104.0" text-anchor="start" class="note">30 probes</text>
<text x="318.0" y="138.0" text-anchor="end">Model with 4 anchors, every rung verified</text>
<path d="M330.0,126.0 h139.6 a4,4 0 0 1 4,4 v8.0 a4,4 0 0 1 -4,4 h-139.6 z" fill="var(--quiet)"/>
<text x="481.6" y="138.0" text-anchor="start" class="val">2 min 47 s</text>
<text x="557.6" y="138.0" text-anchor="start" class="note">4 probes</text>
<text x="318.0" y="172.0" text-anchor="end">Predicted, every rung verified</text>
<path d="M330.0,160.0 h106.9 a4,4 0 0 1 4,4 v8.0 a4,4 0 0 1 -4,4 h-106.9 z" fill="var(--quiet)"/>
<text x="448.9" y="172.0" text-anchor="start" class="val">2 min 09 s</text>
<text x="524.9" y="172.0" text-anchor="start" class="note">no probe</text>
<text x="318.0" y="206.0" text-anchor="end" class="val">Instant</text>
<path d="M330.0,194.0 h6.3 a4,4 0 0 1 4,4 v8.0 a4,4 0 0 1 -4,4 h-6.3 z" fill="var(--s1)"/>
<text x="348.3" y="206.0" text-anchor="start" class="val">12 s</text>
<text x="382.3" y="206.0" text-anchor="start" class="note">no probe, no verification</text>
</svg>
