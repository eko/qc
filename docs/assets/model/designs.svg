<text x="459.8" y="203.0" text-anchor="start" class="val">1.05</text>
<text x="495.8" y="203.0" text-anchor="start" class="note">2 encodes</text>
<text x="318.0" y="235.0" text-anchor="end">3 anchors</text>
<path d="M330.0,223.0 h76.0 a4,4 0 0 1 4,4 v8.0 a4,4 0 0 1 -4,4 h-76.0 z" fill="var(--quiet)"/>
<text x="418.0" y="235.0" text-anchor="start" class="val">0.69</text>
<text x="454.0" y="235.0" text-anchor="start" class="note">3 encodes</text>
<text x="318.0" y="267.0" text-anchor="end">4 anchors</text>
<path d="M330.0,255.0 h51.7 a4,4 0 0 1 4,4 v8.0 a4,4 0 0 1 -4,4 h-51.7 z" fill="var(--quiet)"/>
<text x="396.0" y="267.0" text-anchor="start" class="val">0.48</text>
<text x="432.0" y="267.0" text-anchor="start" class="note">4 encodes</text>
<text x="318.0" y="299.0" text-anchor="end">7 anchors</text>
<path d="M330.0,287.0 h43.6 a4,4 0 0 1 4,4 v8.0 a4,4 0 0 1 -4,4 h-43.6 z" fill="var(--quiet)"/>
<text x="396.0" y="299.0" text-anchor="start" class="val">0.41</text>
<text x="432.0" y="299.0" text-anchor="start" class="note">7 encodes</text>
<text x="318.0" y="331.0" text-anchor="end">10 anchors</text>
<path d="M330.0,319.0 h32.0 a4,4 0 0 1 4,4 v8.0 a4,4 0 0 1 -4,4 h-32.0 z" fill="var(--quiet)"/>
<text x="396.0" y="331.0" text-anchor="start" class="val">0.31</text>
<text x="432.0" y="331.0" text-anchor="start" class="note">10 encodes</text>
<line x1="388.0" y1="84" x2="388.0" y2="348" stroke="var(--ink2)" stroke-width="1"/>
<text x="394.0" y="80.0" text-anchor="start" class="note">default --tolerance 0.5: under it, the ladder needs nothing more</text>
